name: Native prototype packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      COMPANION_PYTHON: python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install Pillow==11.3.0 PyInstaller==6.16.0
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix desktop
      - name: Check code and portable tests
        run: |
          npm run check
          node --test test/*.test.cjs
          python -m unittest discover -s test -p test_photos.py
      - name: Bundle native Python and image decoder
        run: python scripts/build-photo-helper.py
      - name: Package self-contained application
        run: node scripts/package-desktop.cjs
      - name: Test packaged executable with external Python disabled
        run: node scripts/test-packaged.cjs
      - name: Prepare reviewed Codex build and fresh signed-out profile
        run: python scripts/prepare-native-ci.py --work .ci/native-codex
      - name: Test packaged one-click native Codex integration
        run: node scripts/test-native-packaged.cjs
      - name: Verify installed Codex archive and signatures remain unchanged
        if: always()
        run: python scripts/prepare-native-ci.py --work .ci/native-codex --verify-unchanged
      - name: Archive tested prototype and checksum
        run: python scripts/archive-desktop.py
      - name: Upload native prototype
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-appearance-${{ matrix.target }}-prototype
          path: dist/native/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload fixture-only test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-test-${{ matrix.target }}
          path: |
            .ci/packaged-results/self-test-report.json
            .ci/native-results/signed-out-report.json
            .ci/native-results/native-smoke-report.json
            .ci/native-results/native-signed-out-photo.png
            .ci/native-results/native-signed-out-no-look.png
          if-no-files-found: ignore
          retention-days: 14
