name: Desktop alpha checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node: '22'
          - os: ubuntu-24.04
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install image decoder
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run release:check
      - run: npm run release:build
      - name: Check built archive checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      COMPANION_STANDALONE: '1'
      COMPANION_PYTHON: python
      COMPANION_STATE_DIR: ${{ github.workspace }}/.ci/state
      COMPANION_OUTPUT_DIR: ${{ github.workspace }}/.ci/results
      COMPANION_RUNTIME_DIR: ${{ github.workspace }}/.ci/no-codex-installation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node --test test/*.test.cjs
      - run: python -m unittest discover -s test -p test_photos.py
      - run: npm ci --prefix desktop
      - name: macOS launcher and graphical checks
        if: runner.os == 'macOS'
        run: bash launch-macos.command self-test
      - name: Windows launcher and graphical checks
        if: runner.os == 'Windows'
        run: .\launch-windows.cmd self-test
      - name: Show local-fixture test summary
        if: always()
        run: python -c "import json,os,pathlib; p=pathlib.Path(os.environ['COMPANION_OUTPUT_DIR'])/'self-test-report.json'; print(p.read_text() if p.exists() else 'No graphical report was produced')"
